spring:
  rabbitmq:
    # The base profile points at CloudAMQP over TLS; the container speaks plain AMQP on
    # the default vhost.
    ssl:
      enabled: false
    virtual-host: /
  mail:
    username: tests@adventistportal.local
    password: unused-in-tests

jwt:
  secret: dGVzdF9vbmx5X3NlY3JldF9uZXZlcl91c2VkX291dHNpZGVfdGhlX3Rlc3RfY29udGFpbmVycw==

# Credentials the production profile demands but nothing on the paths under test reaches.
supabase:
  service-key: unused-in-tests

firebase:
  enabled: false

nginx:
  require-proxy: false
  trustedIps:
    - "127.0.0.1"
    - "::1"

adventistportal:
  email:
    from: tests@adventistportal.local
    url: "http://localhost"
    verification:
      expiry-hours: 24
    reset-password:
      expiry-minutes: 30
  ip:
    rate-limit:
      apply-limit: false

logging:
  level:
    liquibase: WARN
    org.testcontainers: WARN
