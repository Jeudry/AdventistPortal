spring:
  rabbitmq:
    # The container speaks plain AMQP on the default vhost.
    virtual-host: /
  cache:
    # No Redis container here; caching is not what these tests assert.
    type: none

adventistportal:
  users:
    grpc-target: localhost:19090

supabase:
  service-key: unused-in-tests

logging:
  level:
    liquibase: WARN
    org.testcontainers: WARN
