spring:
  config:
    import: classpath:config/tracing.yml
  application:
    name: chat-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres.adventistportal.orb.local:5432/adventistportal?sslmode=disable}
    # Its own role, granted on chat_service only. A shared Postgres keeps the boundary
    # only if the database enforces it; otherwise it is a naming convention.
    username: ${DB_USER:chat_service}
    password: ${DB_PASSWORD:chat_service}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: ${adventistportal.outbox.schema}

  data:
    redis:
      # Loopback, not the .orb.local name: Lettuce resolves through Netty, which does not
      # consult the OrbStack resolver, and the container publishes 6379 on 127.0.0.1.
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USER:default}
      password: ${REDIS_PASSWORD:adventistportal_redis_password}

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq.adventistportal.orb.local}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:adventistportal_user}
    password: ${RABBITMQ_PASSWORD:adventistportal_password}
    virtual-host: ${RABBITMQ_VHOST:adventistportal}

jwt:
  # The one place a token is still read behind the gateway. Spring Cloud Gateway Server
  # WebMVC does not proxy WebSockets, so the handshake reaches this service directly and
  # has to authenticate itself. Moving the gateway to the WebFlux variant would close it.
  secret: ${JWT_SECRET_BASE64}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

server:
  port: ${SERVER_PORT:8085}

adventistportal:
  outbox:
    schema: chat_service
  messaging:
    publishes-to:
      - chat.events
    queues:
      user-events: chat.user.events
    subscriptions:
      - queue: ${adventistportal.messaging.queues.user-events}
        exchange: user.events
        routing-key: "user.*"
  security:
    public-paths: []
  web-socket:
    allowed-origins:
      - ${PUBLIC_ORIGIN:http://localhost:8080}

supabase:
  url: ${SUPABASE_URL:https://aqotufsmvyrfeuvfnjhv.supabase.co}
  service-key: ${SUPABASE_SERVICE_KEY}

logging:
  level:
    com.adventistportal: INFO
