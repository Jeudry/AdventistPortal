spring:
  config:
    import: classpath:config/tracing.yml
  application:
    name: inventory-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres.adventistportal.orb.local:5432/adventistportal?sslmode=disable}
    # Its own role, granted on inventory_service only. A shared Postgres keeps the
    # boundary only if the database enforces it; otherwise it is a naming convention.
    username: ${DB_USER:inventory_service}
    password: ${DB_PASSWORD:inventory_service}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: ${adventistportal.outbox.schema}

server:
  port: ${SERVER_PORT:8084}

adventistportal:
  outbox:
    # Declared once: Liquibase and the outbox both read it, so they cannot disagree about
    # which schema this service owns.
    schema: inventory_service
  # Nothing here is reachable without a caller; the register is not public.
  security:
    public-paths: []

logging:
  level:
    com.adventistportal: INFO
