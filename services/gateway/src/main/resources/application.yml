spring:
  config:
    import: classpath:config/tracing.yml
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          # One route per feature, never per deployable. Two features sharing a URI is a
          # deployment detail, and extracting one is then a change of address rather than
          # a change of routing.
          routes:
            - id: user
              uri: ${SERVICE_USER_URI:http://localhost:8083}
              predicates:
                - Path=/api/auth/**

            - id: notification
              uri: ${SERVICE_NOTIFICATION_URI:http://localhost:8082}
              predicates:
                - Path=/api/notification/**

            - id: chat
              uri: ${SERVICE_CHAT_URI:http://localhost:8085}
              predicates:
                - Path=/api/chat/**,/api/messages/**,/api/participants/**

            # The reason the gateway runs on the reactive stack at all: the servlet
            # variant cannot proxy this, so the handshake used to reach chat directly.
            - id: chat-websocket
              uri: ${SERVICE_CHAT_WS_URI:ws://localhost:8085}
              predicates:
                - Path=/ws/chat

            - id: inventory
              uri: ${SERVICE_INVENTORY_URI:http://localhost:8084}
              predicates:
                - Path=/graphql/**


gateway:
  api-key:
    # Shared with the client at build time. It is not a secret in any strong sense — it
    # ships inside the app — so it gates the door and decides nothing about who you are.
    value: ${API_KEY:?the client sends X-API-Key on every request; set the same value here}
  cors:
    allowed-origins:
      - http://localhost:8080

spring.data.redis:
  host: ${REDIS_HOST:127.0.0.1}
  port: ${REDIS_PORT:6379}
  username: ${REDIS_USER:default}
  password: ${REDIS_PASSWORD:adventistportal_redis_password}

jwt:
  # The public half only. The gateway is the process exposed to the internet, and it
  # should not be able to mint the tokens it checks.
  public-key: ${JWT_PUBLIC_KEY}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.springframework.cloud.gateway: INFO
