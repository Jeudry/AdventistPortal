spring:
  config:
    import: classpath:config/tracing.yml
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          # One route per feature, never per deployable. Two features sharing a URI is a
          # deployment detail, and extracting one is then a change of address rather than
          # a change of routing.
          routes:
            - id: user
              uri: ${SERVICE_USER_URI:http://localhost:8083}
              predicates:
                - Path=/api/auth/**

            - id: notification
              uri: ${SERVICE_NOTIFICATION_URI:http://localhost:8082}
              predicates:
                - Path=/api/notification/**

            - id: chat
              uri: ${SERVICE_CHAT_URI:http://localhost:8085}
              predicates:
                - Path=/api/chat/**,/api/messages/**,/api/participants/**

            - id: inventory
              uri: ${SERVICE_INVENTORY_URI:http://localhost:8084}
              predicates:
                - Path=/graphql/**


gateway:
  cors:
    allowed-origins:
      - http://localhost:8080

jwt:
  secret: ${JWT_SECRET_BASE64}
  # Never used: the gateway only verifies. Signing lives in the user service.
  expiration-minutes: 0

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.springframework.cloud.gateway: INFO
