spring:
  rabbitmq:
    # The container speaks plain AMQP on the default vhost.
    virtual-host: /

jwt:
  # A pair generated for the tests and nothing else. Signing is exercised here, so both
  # halves are present; every other service gets only the public one.
  private-key: 
  public-key: 

adventistportal:
  ip:
    rate-limit:
      # Off, so that repeated logins in a test are not throttled into failing.
      apply-limit: false

logging:
  level:
    liquibase: WARN
    org.testcontainers: WARN
