# The whole system, in one file.
#
# `docker compose up` runs everything. `docker compose up postgres redis rabbitmq zipkin`
# runs just the infrastructure, for when you want one service in a debugger instead. It
# used to be two files, which meant two Postgres containers with two copies of the data
# and no way to tell which one you were looking at.
#
# The services publish nothing; the gateway does. That is not tidiness: they trust the
# X-AP-User-Id header the gateway asserts, and that trust is only sound while nothing else
# can reach them to assert it themselves. The databases do publish, on loopback, because
# running a service from Gradle has to reach them.

x-service-defaults: &service-defaults
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  networks:
    - adventistportal-network
  environment: &service-environment
    DB_URL: jdbc:postgresql://postgres:5432/adventistportal
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_USER: adventistportal_user
    RABBITMQ_PASSWORD: adventistportal_password
    RABBITMQ_VHOST: adventistportal
    REDIS_HOST: redis
    REDIS_PASSWORD: adventistportal_redis_password
    ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?run scripts/gen-jwt-keys.sh and put both keys in .env}
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    # Not optional in practice: the span reporter drops what it cannot send and then
    # logs nothing further, so a collector that is merely late looks like one that works.
    zipkin:
      condition: service_healthy

services:
  gateway:
    <<: *service-defaults
    # Named so `docker compose pull` can fetch what CI published instead of building.
    image: ghcr.io/jeudry/adventistportal/gateway:${IMAGE_TAG:-edge}
    build:
      context: .
      args:
        SERVICE: gateway
    # The only published port in the file.
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      <<: *service-environment
      SERVER_PORT: 8080
      SERVICE_USER_URI: http://user:8080
      SERVICE_NOTIFICATION_URI: http://notification:8080
      SERVICE_CHAT_URI: http://chat:8080
      SERVICE_CHAT_WS_URI: ws://chat:8080
      SERVICE_INVENTORY_URI: http://inventory:8080
      # Only the gateway checks it; nothing behind it should care.
      API_KEY: ${API_KEY:?the client sends X-API-Key on every request; set the same value in .env}
    depends_on:
      - user
      - notification
      - chat
      - inventory

  user:
    <<: *service-defaults
    # Named so `docker compose pull` can fetch what CI published instead of building.
    image: ghcr.io/jeudry/adventistportal/user:${IMAGE_TAG:-edge}
    build:
      context: .
      args:
        SERVICE: user
    environment:
      <<: *service-environment
      SERVER_PORT: 8080
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-no-reply@adventistportal.local}
      # Only here. Nothing else in the file gets the private half.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?run scripts/gen-jwt-keys.sh and put both keys in .env}

  notification:
    <<: *service-defaults
    # Named so `docker compose pull` can fetch what CI published instead of building.
    image: ghcr.io/jeudry/adventistportal/notification:${IMAGE_TAG:-edge}
    build:
      context: .
      args:
        SERVICE: notification
    environment:
      <<: *service-environment
      SERVER_PORT: 8080
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-no-reply@adventistportal.local}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}

  chat:
    <<: *service-defaults
    # Named so `docker compose pull` can fetch what CI published instead of building.
    image: ghcr.io/jeudry/adventistportal/chat:${IMAGE_TAG:-edge}
    build:
      context: .
      args:
        SERVICE: chat
    environment:
      <<: *service-environment
      SERVER_PORT: 8080
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}

  inventory:
    <<: *service-defaults
    # Named so `docker compose pull` can fetch what CI published instead of building.
    image: ghcr.io/jeudry/adventistportal/inventory:${IMAGE_TAG:-edge}
    build:
      context: .
      args:
        SERVICE: inventory
    environment:
      <<: *service-environment
      SERVER_PORT: 8080

  zipkin:
    image: openzipkin/zipkin:latest
    restart: unless-stopped
    hostname: zipkin
    # Published for the same reason as the databases: it is where you go to read a trace,
    # and it holds nothing but timings.
    ports:
      - "${ZIPKIN_PORT:-9411}:9411"
    networks:
      - adventistportal-network

  postgres:
    image: postgres:16-alpine
    container_name: adventistportal-postgres
    hostname: postgres
    environment:
      POSTGRES_DB: adventistportal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c listen_addresses='*'
      -c max_connections=100
      -c shared_buffers=128MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adventistportal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adventistportal-network
    labels:
      - "com.orbstack.domains=postgres.adventistportal.local"

  redis:
    image: redis:7-alpine
    container_name: adventistportal-redis
    hostname: redis
    command: redis-server --requirepass adventistportal_redis_password
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adventistportal-network
    labels:
      - "com.orbstack.domains=redis.adventistportal.local"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: adventistportal-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: adventistportal_user
      RABBITMQ_DEFAULT_PASS: adventistportal_password
      RABBITMQ_DEFAULT_VHOST: adventistportal
    ports:
      - "127.0.0.1:5673:5672"   # AMQP: 5672 on the host belongs to polux
      - "127.0.0.1:15673:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adventistportal-network
    labels:
      - "com.orbstack.domains=rabbitmq.adventistportal.local"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  adventistportal-network:
    driver: bridge
